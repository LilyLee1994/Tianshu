<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天枢</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f4f6f8;color:#1b2430;text-align:center;padding:24px;box-sizing:border-box}
  .logo{width:72px;height:72px;border-radius:20px;background:#0f6b66;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 8px;color:#0f6b66}
  p{margin:6px 0;color:#5b6675;font-size:14px;line-height:1.6}
  .spin{width:28px;height:28px;border:3px solid #cfe3e1;border-top-color:#0f6b66;border-radius:50%;animation:s 0.9s linear infinite;margin:16px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  button{margin-top:16px;min-height:44px;padding:0 28px;border:0;border-radius:10px;background:#0f6b66;color:#fff;font-size:16px}
  #err{display:none}
  code{background:#e8edf0;padding:2px 6px;border-radius:4px;font-size:12px;word-break:break-all}
</style></head>
<body>
  <div class="logo"><svg width="44" height="44" viewBox="0 0 44 44"><path d="M11 14l5.5 17L22 19l5.5 12L33 14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="load"><h1>天枢</h1><div class="spin"></div><p>正在连接…</p></div>
  <div id="err"><h1>连不上服务器</h1>
    <p>请检查手机网络，或换 Wi-Fi / 流量再试。</p>
    <p>网址：<code id="u"></code></p>
    <p id="why" style="font-size:12px"></p>
    <button onclick="go()">重试</button></div>
<script>
  var URL_ = 'https://tianshu-five.vercel.app/'
  document.getElementById('u').textContent = URL_
  function fail(m){document.getElementById('load').style.display='none';document.getElementById('err').style.display='block';document.getElementById('why').textContent=m||''}
  function go(){
    document.getElementById('err').style.display='none';document.getElementById('load').style.display='block'
    var done=false, t=setTimeout(function(){ if(!done){done=true;fail('连接超时（15 秒）')} },15000)
    fetch(URL_,{mode:'no-cors',cache:'no-store'}).then(function(){ if(done)return; done=true; clearTimeout(t); location.replace(URL_) })
      .catch(function(e){ if(done)return; done=true; clearTimeout(t); fail('错误：'+(e&&e.message||e)) })
  }
  go()
</script></body></html>
