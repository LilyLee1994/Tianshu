<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6b66" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天枢</title>
  </head>
  <body>
        <script>
      // 页面 6 秒内没渲染出来（旧手机的网页组件不支持新写法等），显示出错原因，不留一片白屏
      (function () {
        var errs = []
        window.addEventListener('error', function (e) { errs.push(String(e.message || e.error || 'error')) })
        window.addEventListener('unhandledrejection', function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)) })
        setTimeout(function () {
          var r = document.getElementById('root')
          if (r && !r.children.length) {
            r.innerHTML = '<div style="padding:32px 20px;font-family:sans-serif;text-align:center;color:#1b2430"><h2 style="color:#0f6b66">页面没能打开</h2><p style="color:#5b6675;font-size:14px">可能是手机的网页组件太旧。请把下面的内容截图发给管理员。</p><p style="font-size:12px;word-break:break-all;background:#eef1f4;padding:10px;border-radius:8px;text-align:left">' + (errs.join(" | ") || '没有错误信息') + '<br>' + navigator.userAgent + '</p><button onclick="location.reload()" style="min-height:44px;padding:0 28px;border:0;border-radius:10px;background:#0f6b66;color:#fff;font-size:16px">重试</button></div>'
          }
        }, 6000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
